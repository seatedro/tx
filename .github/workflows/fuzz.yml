name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          use-cache: false
      - uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      # The fuzzer keeps its corpus in .zig-cache/f and coverage in
      # .zig-cache/v. A cache key can't be saved twice, so each run saves
      # under its own run id and restores the newest by prefix.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache/f
            .zig-cache/v
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-

      # zig build --fuzz runs until killed, also after a test fails. timeout
      # exits with 124 when the 30 minutes run out, the expected end. A failure
      # shows as the input the build runner saves to .zig-cache/f/crash, and
      # the rm drops one restored from the cache.
      - name: Fuzz
        run: |
          rm -f .zig-cache/f/crash
          timeout 30m zig build fuzz --fuzz > fuzz.log 2>&1 || test $? -eq 124
          tail -n 40 fuzz.log
          for dir in .zig-cache/f/*/; do echo "$dir: $(find "$dir" -type f | wc -l) inputs"; done
          if [ -e .zig-cache/f/crash ]; then
            echo "::error::a fuzz test failed; see fuzz.log in the fuzz-crash artifact"
            exit 1
          fi

      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache/f
            .zig-cache/v
          key: fuzz-${{ github.run_id }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: |
            fuzz.log
            .zig-cache/f/crash
