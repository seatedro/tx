# Publishes main as the latest release, which install.sh downloads by default.
name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# gh needs contents: write to create and delete releases, and actions: read
# to list ci.yml's runs.
permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # git rev-list resolves the latest release's tag, and a shallow clone has
      # no tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Sets version to BASE-nightly.YYYYMMDD, with BASE from build.zig.zon,
      # when a release is due.
      - id: plan
        run: |
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
            echo "$last is main already"
            exit 0
          fi
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'map(select(.conclusion == "success")) | length')
          if [ "$passed" = 0 ]; then
            echo "CI hasn't passed on $GITHUB_SHA"
            exit 0
          fi
          base=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          echo "version=$base-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.version
        uses: mlugg/setup-zig@v2
      - if: steps.plan.outputs.version
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - if: steps.plan.outputs.version
        run: zig build release -Dversion=${{ steps.plan.outputs.version }}
      # install.sh finds its tarball and checksum in SHA256SUMS. tx's install
      # command downloads install.sh from the latest release. A second run on
      # one day replaces that day's release.
      - if: steps.plan.outputs.version
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          cd zig-out/release
          sha256sum tx-*.tar.gz > SHA256SUMS
          cp ../../install.sh .
          gh release delete "v$VERSION" --cleanup-tag --yes 2>/dev/null || true
          gh release create "v$VERSION" --target "$GITHUB_SHA" --latest \
            --title "tx $VERSION" --notes "Nightly build of $GITHUB_SHA." \
            tx-*.tar.gz SHA256SUMS install.sh
