name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends wl-clipboard
      - run: zig fmt --check src build.zig
      - run: zig build test --summary all

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - run: zig build release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: zig-out/release/
